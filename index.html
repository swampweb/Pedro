<!-- Replace only the login section in your current index.html -->
<section id="login-view" class="view active login-view">
  <div class="brand-side refined-brand">
    <img class="login-brand-logo" src="assets/logo/pedro_logo.png" alt="Pedro Logo">
    <div class="brand-tagline">
      <h2>The South Louisiana Card Game</h2>
      <p>Four Players • Two Teams • One Winner</p>
    </div>
  </div>

  <form id="login-form" class="panel login-panel">
    <p class="eyebrow gold">WELCOME TO THE TABLE</p>
    <h2>Sign in to play</h2>

    <label>Email address
      <input id="login-email" type="email" placeholder="you@example.com">
    </label>

    <label>Password
      <input id="login-password" type="password" placeholder="Enter your password">
    </label>

    <div class="split small">
      <label class="inline-check"><input type="checkbox"> Remember me</label>
      <button class="text-button" type="button">Forgot password?</button>
    </div>

    <button class="primary wide" type="submit">SIGN IN</button>
    <button class="secondary wide" type="button">CREATE ACCOUNT</button>

    <p class="center muted tiny">
      Supabase authentication will replace demo login in the next update.
    </p>
  </form>
</section>
